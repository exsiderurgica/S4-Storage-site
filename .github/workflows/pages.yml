name: Publish S4 Storage site

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "S4-Storage-latest.apk"
      - "S4-Storage-v0.6.2.apk"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp S4-Storage-latest.apk _site/S4-Storage-latest.apk
          cp S4-Storage-v0.6.2.apk _site/S4-Storage-v0.6.2.apk
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
